[platformio]

[digboards]
build_flags_spectrum=
  -D WLED_REPO=\"CosmicCrouton/WLED/tree/feature/clnp_v15\"
  -D WLED_BRAND="\"Spectrum\""

  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_ESPNOW

  -D WLED_AUTOSEGMENTS

build_flags_clnp =
  -D WLED_ENABLE_CLNP
  -D CLNP_DEFAULT_BAUD=19200
  -D CLNP_TX_PIN=2
  -D CLNP_RX_PIN=32
  -D CLNP_EN_PIN=12
  -D CLNP_UART_NUM=2

build_flags_ethernet =
  -D WLED_USE_ETHERNET
  -D WLED_ETH_DEFAULT=4

build_flags_dig_quad =
  -D NOWIFISLEEP=false
  -D WLED_DISABLE_BLYNK
  -D RLYPIN=-1
  -D BTNPIN=-1
  -D IRPIN=-1
  -D PIXEL_COUNTS=4,4,4,4
  -D DATA_PINS=16,3,1,4
  -D ABL_MILLIAMPS_DEFAULT=1250
  -D LED_MILLIAMPS_DEFAULT=10
  -D LED_TYPES=TYPE_WS2805,TYPE_WS2805,TYPE_WS2805,TYPE_WS2805
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_RGB

[env:spectrum-Quad-ETHON]
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags}
  -D WLED_PRODUCT_NAME="\"Spectrum\""
  -D SERVERNAME="\"Spectrum\""
  -D WLED_RELEASE_NAME="\"Spectrum\""
  ${digboards.build_flags_spectrum}
  ${digboards.build_flags_dig_quad}
  ${digboards.build_flags_ethernet}
  ${digboards.build_flags_clnp}
  -DARDUINO_USB_CDC_ON_BOOT=0

upload_speed = 921600

lib_deps = ${esp32.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
extra_scripts  = ${scripts_defaults.extra_scripts}
